    slot: 13
    material: SUGAR
    name: '&bBooster de Velocidade'
    lore:
      - ''
      - ' &7Estado: {state}'
      - ' &7Booster: {booster}'
      - ' &7Multiplicador: &fx{multiplier}'
      - ' &7Tempo restante: &f{time}'
