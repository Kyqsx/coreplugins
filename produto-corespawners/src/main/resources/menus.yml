  size: 27
  back-slot: 22
  # Placeholders extras: {state} {booster} {multiplier} {time}
  drops:
    slot: 11
    material: EXPERIENCE_BOTTLE
    name: '&6Booster de Drops'
    lore:
      - ''
      - ' &7Estado: {state}'
      - ' &7Booster: {booster}'
      - ' &7Multiplicador: &fx{multiplier}'
      - ' &7Tempo restante: &f{time}'
