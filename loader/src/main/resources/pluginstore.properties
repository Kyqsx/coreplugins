# Valores embutidos no jar no build (o cliente não edita nada).
# api-url vem de -Dlicense.api.url=... (padrão no pom.xml raiz).
api-url=${license.api.url}
check-interval-minutes=30
retry-interval-seconds=60
timeout-seconds=10
# Só uma negação ASSINADA pelo license-server desliga o servidor; falha de rede nunca.
shutdown-on-denied=true
# Negação com o servidor já no ar: desabilita os plugins e desliga o servidor depois desta carência (0 = na hora).
denied-grace-minutes=5
